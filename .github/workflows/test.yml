name: regression

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgeos-dev libproj-dev libgdal-dev \
            fonts-dejavu-core fonts-noto-cjk fonts-liberation
          fc-cache -f

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
          python -m pip install affine

      # SimHei and Arial are proprietary and are not redistributed here. On a
      # machine without them configure_fonts() raises on purpose rather than
      # substituting silently, so CI declares the substitute explicitly instead
      # of weakening the rule. The check below makes that substitution visible.
      - name: Report font resolution
        run: python scripts/check_environment.py

      - name: Regression checks
        run: python scripts/test_rendering.py "$RUNNER_TEMP/figure-work"
        env:
          MPLBACKEND: Agg
          GIS_FIGURE_FONT_ZH: "SimHei,Noto Sans CJK SC"
          GIS_FIGURE_FONT_EN: "Arial,Liberation Sans,DejaVu Sans"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: ${{ runner.temp }}/figure-work/test-results.json
          if-no-files-found: ignore
